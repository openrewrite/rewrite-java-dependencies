---
name: Update the Old GroupId migrations CSV

on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 10 * * MON

concurrency:
  group: migrations
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-migrations:
    if: github.event_name != 'schedule' || github.repository_owner == 'openrewrite'
    runs-on: ubuntu-latest
    env:
      BRANCH: automation/old-groupid-migrations
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          cache: 'gradle'
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout oga-maven-plugin
        uses: actions/checkout@v7
        with:
          repository: jonathanlermitage/oga-maven-plugin
          path: oga-maven-plugin
      - name: Update migrations
        run: ./gradlew parseDefinitionMigrations --args="./oga-maven-plugin src/main/resources/migrations.csv"
        env:
          ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
          ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}

      # main requires the cgp check, so open a pull request instead of pushing
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- src/main/resources/migrations.csv && exit 0
          git config user.email "team@moderne.io"
          git config user.name "team-moderne[bot]"
          NOW=$(date +'%Y-%m-%dT%H%M')
          git switch -C "$BRANCH"
          git add src/main/resources/migrations.csv
          git commit -m "[Auto] Old GroupId migrations as of $NOW"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "[Auto] Old GroupId migrations" \
              --body "Regenerated \`migrations.csv\` from jonathanlermitage/oga-maven-plugin as of $NOW. Rows skipped by \`ParseDefinitionMigrations\` are listed in the workflow log."
          fi
